# Architecture
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3


# Inference
data_path: example/interactive_50cases_12prompts_18latent.jsonl
output_folder: videos/interactive_50cases_12prompts_18latent
inference_iter: -1
num_output_frames: 216
use_ema: false
seed: 1
num_samples: 1
save_with_index: true
switch_frame_indices: 18, 36, 54, 72, 90, 108, 126, 144, 162, 180, 198
global_sink: true
context_noise: 0

base_model_dir: ../models/Wan2.1-T2V-1.3B
generator_ckpt: longlive_models/models/longlive_base.pt
lora_ckpt: longlive_models/models/lora.pt

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  verbose: false
